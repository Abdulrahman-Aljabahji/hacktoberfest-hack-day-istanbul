kind = "web"
previewPath = "/"
title = "KÖPRÜ"
description = "KÖPRÜ turns a photo or pasted text of a confusing sign or notice (Turkish, Arabic, English) into an actionable multilingual checklist with verbatim evidence quotes and a phrase to say aloud, powered by Gemma 4 via the Gemini API."
version = "1.0.0"
id = "artifacts/koprue"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20216

[services.development]
run = "pnpm --filter @workspace/koprue run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/koprue", "run", "build" ]
serve = "static"
publicDir = "artifacts/koprue/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20216"
BASE_PATH = "/"
