openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: interpret
    description: Notice interpretation
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /interpret/status:
    get:
      operationId: getInterpretStatus
      tags: [interpret]
      summary: Whether live model analysis is configured
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterpretStatus"
  /interpret:
    post:
      operationId: interpretNotice
      tags: [interpret]
      summary: Turn a photo or pasted text of a notice into an action plan using Gemma 4
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InterpretInput"
      responses:
        "200":
          description: Action plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterpretResult"
        "400":
          description: Bad request or unsupported image
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: Image too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limit or model quota reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Model unavailable or returned an unusable answer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Live analysis not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "504":
          description: Model timed out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    InterpretStatus:
      type: object
      required: [connected, model]
      properties:
        connected:
          type: boolean
        model:
          type: string
    InterpretInput:
      type: object
      required: [lang]
      properties:
        lang:
          type: string
          enum: [en, tr, ar]
          description: Target language of the result
        text:
          type: string
          description: Pasted notice text
        image:
          type: string
          description: Data URL (jpeg/png/webp base64) of a photographed notice
    EvidenceStatus:
      type: string
      enum: [verified, unverified, none, ai-extracted]
      description: >
        verified = the quote was found in the pasted text by a deterministic check.
        unverified = the quote was NOT found in the pasted text.
        none = the model gave no quote.
        ai-extracted = the quote was read from an image by the model and is not checked.
    PlanStep:
      type: object
      required: [title, detail, source, evidence]
      properties:
        title: { type: string }
        detail: { type: string }
        source: { type: string, description: Original-language evidence quote proposed by the model, may be empty }
        evidence:
          $ref: "#/components/schemas/EvidenceStatus"
    PlanFact:
      type: object
      required: [label, value, source, evidence]
      properties:
        label: { type: string }
        value: { type: string }
        source: { type: string }
        evidence:
          $ref: "#/components/schemas/EvidenceStatus"
    PlanPhrase:
      type: object
      required: [native, meaning]
      properties:
        native: { type: string }
        meaning: { type: string }
    ActionPlan:
      type: object
      required: [headline, summary, sourceLang, steps, facts, phrase, caution]
      properties:
        headline: { type: string }
        summary: { type: string }
        sourceLang:
          type: string
          enum: [tr-TR, en-US, ar-SA]
        steps:
          type: array
          items:
            $ref: "#/components/schemas/PlanStep"
        facts:
          type: array
          items:
            $ref: "#/components/schemas/PlanFact"
        phrase:
          $ref: "#/components/schemas/PlanPhrase"
        caution: { type: string }
    InterpretResult:
      type: object
      required: [plan, mode]
      properties:
        plan:
          $ref: "#/components/schemas/ActionPlan"
        mode:
          type: string
          enum: [live]
    ErrorCode:
      type: string
      enum:
        - invalid_request
        - invalid_image
        - image_too_large
        - rate_limited
        - quota_exceeded
        - not_configured
        - timeout
        - upstream_unavailable
        - bad_model_response
        - server_error
    ErrorResponse:
      type: object
      required: [error, code]
      properties:
        error: { type: string }
        code:
          $ref: "#/components/schemas/ErrorCode"
